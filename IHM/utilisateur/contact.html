<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - VoltForce</title>
  <link rel="stylesheet" href="css/bootstrap.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Lien pour les icônes FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
  <div class="hero_area">
    <!-- Header Section -->
    <header class="header_section">
      <div class="header_top">
        <div class="container-fluid">
          <div class="contact_nav">
            <a href="login.html" class="btn btn-primary">Se connecter</a>
          </div>
        </div>
      </div>
      <div class="header_bottom">
        <div class="container-fluid">
          <nav class="navbar navbar-expand-lg custom_nav-container">
            <a class="navbar-brand" href="index.html">
              <span>VoltForce</span>
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" href="index.html">Accueil</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="about.html">À propos</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="service.html">Services</a>
                </li>
                <li class="nav-item active">
                  <a class="nav-link" href="contact.html">Contact</a>
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </div>
    </header>

    <!-- Contact Section -->
    <section class="contact_section layout_padding">
      <div class="container">
        <div class="heading_container">
          <h2>Contactez-nous</h2>
        </div>
        <div class="row">
          <div class="col-md-6">
            <form action="">
              <div>
                <input type="text" placeholder="Nom" />
              </div>
              <div>
                <input type="text" placeholder="Numéro de téléphone" />
              </div>
              <div>
                <input type="email" placeholder="Email" />
              </div>
              <div>
                <textarea class="message-box" placeholder="Message"></textarea>
              </div>
              <div class="d-flex">
                <button type="submit" class="btn btn-primary">Envoyer</button>
              </div>
            </form>
          </div>
          <div class="col-md-6">
            <div class="contact_info">
              <div class="email_info">
                <i class="fas fa-envelope"></i>
                <p>powerElectricity@gmail.com</p>
              </div>
              <div class="social_links">
                <a href="https://www.instagram.com/voltforce" target="_blank">
                  <i class="fab fa-instagram"></i>
                  <span>Suivez-nous sur Instagram</span>
                </a>
              </div>
            </div>
            <!-- Remplacement de la carte par une image -->
            <div class="map_container">
              <img src="images/amandis.png" alt="Adresse de VoltForce" style="width:100%; height:auto;">
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Footer Section -->
  <footer class="footer_section">
    <div class="container">
      <p>&copy; <span id="displayDateYear"></span> VoltForce. Tous droits réservés.</p>
      <p>
        <a href="privacy.html">Politique de confidentialité</a> | 
        <a href="terms.html">Mentions légales</a> | 
        <a href="contact.html">Contact</a>
      </p>
    </div>
  </footer>

  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/bootstrap.js"></script>
  <script src="js/custom.js"></script>
</body>

</html>
